# Include this file inside nginx's `http {}` block, before the PharMate server
# block. It emits compact JSON suitable for CloudWatch, Loki, or another
# centralized log collector.
log_format pharmate_json escape=json
  '{"timestamp":"$time_iso8601","event":"nginx_request",'
  '"request_id":"$request_id","method":"$request_method",'
  '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"duration_seconds":$request_time,"upstream_seconds":"$upstream_response_time",'
  '"source_ip":"$remote_addr"}';
