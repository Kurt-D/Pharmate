name: PharMate CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pharmate_jest_test
          MYSQL_USER: pharmate
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: root-test-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: pharmate_jest_test
      DB_USER: pharmate
      DB_PASS: test-password
      TEST_DB_NAME: pharmate_jest_test
      JWT_SECRET: test-access-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      JWT_REFRESH_SECRET: test-refresh-secret-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      AES_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      OTP_SECRET: test-otp-secret-cccccccccccccccccccccccccccccccccccccccccccccccc
      RESET_TOKEN_SECRET: test-reset-secret-dddddddddddddddddddddddddddddddddddddddddddddd
      GOOGLE_CLIENT_ID: test-client.apps.googleusercontent.com
      CAPTCHA_PROVIDER: self-hosted
      CAPTCHA_SIGNING_SECRET: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install locked dependencies
        run: |
          npm --prefix server ci
          npm --prefix client ci
      - name: Lint server and client
        run: |
          npm --prefix server run lint
          npm --prefix client run lint
      - name: Dependency audit
        run: |
          npm --prefix server audit --omit=dev --audit-level=high
          npm --prefix client audit --omit=dev --audit-level=high
      - name: Run server tests
        run: npm --prefix server test
      - name: Build immutable web artifact
        run: npm --prefix client run build
      - name: Package release
        run: tar --exclude-vcs --exclude='server/.env' --exclude='server/uploads' --exclude='server/node_modules' --exclude='client/node_modules' -czf pharmate-${{ github.sha }}.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: pharmate-${{ github.sha }}
          path: pharmate-${{ github.sha }}.tgz
          retention-days: 30
